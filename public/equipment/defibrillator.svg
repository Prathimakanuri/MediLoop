<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="defiBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#b91c1c" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Defibrillator Main Case -->
  <g filter="url(#dropShadow)">
    <rect x="180" y="110" width="440" height="340" rx="28" fill="url(#defiBody)" stroke="#7f1d1d" stroke-width="4"/>
    
    <!-- Heavy Duty Handle -->
    <path d="M 320 110 L 320 70 Q 320 50 340 50 L 460 50 Q 480 50 480 70 L 480 110 Z" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <rect x="360" y="60" width="80" height="15" rx="4" fill="#64748b"/>

    <!-- Inner Console Faceplate -->
    <rect x="205" y="135" width="390" height="290" rx="18" fill="#f8fafc"/>

    <!-- Left: Clinical Screen -->
    <rect x="220" y="150" width="220" height="150" rx="10" fill="#020617" stroke="#334155" stroke-width="2"/>
    <text x="230" y="172" font-family="sans-serif" font-size="11" fill="#ef4444" font-weight="bold">VFIB DETECTED - SHOCK ADVISED</text>
    <!-- Ventricular Fibrillation waveform -->
    <path d="M 230 220 Q 240 180 250 240 T 270 200 T 290 250 T 310 180 T 330 240 T 350 190 T 370 250 T 390 190 T 410 240 T 430 210" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <text x="230" y="275" font-family="sans-serif" font-size="12" fill="#22c55e" font-weight="bold">ENERGY: 200J BIPHASIC</text>
    <text x="230" y="292" font-family="sans-serif" font-size="10" fill="#38bdf8">CPR TIME: 01:45 | SHOCKS: 1</text>

    <!-- Right: Big Shock Button & Controls -->
    <rect x="460" y="150" width="120" height="150" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Glowing Shock Button -->
    <circle cx="520" cy="210" r="34" fill="#ea580c"/>
    <circle cx="520" cy="210" r="28" fill="#f97316"/>
    <!-- Lightning Bolt Symbol -->
    <polygon points="522,192 506,212 518,212 514,228 534,206 522,206" fill="#ffffff"/>
    <text x="520" y="260" font-family="sans-serif" font-size="11" fill="#c2410c" font-weight="900" text-anchor="middle">SHOCK</text>

    <!-- Energy Selector Dial -->
    <circle cx="280" cy="360" r="30" fill="#1e293b"/>
    <circle cx="280" cy="360" r="22" fill="#334155"/>
    <rect x="277" y="335" width="6" height="25" fill="#f8fafc"/>
    <text x="280" y="410" font-family="sans-serif" font-size="10" fill="#0f172a" font-weight="bold" text-anchor="middle">ENERGY DIAL</text>

    <rect x="360" y="340" width="70" height="40" rx="8" fill="#eab308"/>
    <text x="395" y="365" font-family="sans-serif" font-size="11" fill="#78350f" font-weight="bold" text-anchor="middle">CHARGE</text>

    <rect x="460" y="340" width="120" height="40" rx="8" fill="#0d9488"/>
    <text x="520" y="365" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">AED / MANUAL</text>
  </g>

  <!-- External Defibrillator Paddles on Side Cradles -->
  <g filter="url(#dropShadow)">
    <!-- Left Apex Paddle -->
    <rect x="90" y="240" width="75" height="120" rx="14" fill="#1e293b"/>
    <rect x="100" y="255" width="55" height="60" rx="6" fill="#cbd5e1"/>
    <rect x="110" y="330" width="35" height="18" rx="4" fill="#ef4444"/>
    <text x="127" y="343" font-family="sans-serif" font-size="8" fill="#ffffff" font-weight="bold" text-anchor="middle">APEX</text>
    <path d="M 127 360 C 127 440, 160 480, 210 460" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>

    <!-- Right Sternum Paddle -->
    <rect x="635" y="240" width="75" height="120" rx="14" fill="#1e293b"/>
    <rect x="645" y="255" width="55" height="60" rx="6" fill="#cbd5e1"/>
    <rect x="655" y="330" width="35" height="18" rx="4" fill="#ef4444"/>
    <text x="672" y="343" font-family="sans-serif" font-size="8" fill="#ffffff" font-weight="bold" text-anchor="middle">STERNUM</text>
    <path d="M 672 360 C 672 440, 640 480, 590 460" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Badge Header -->
  <rect x="230" y="20" width="340" height="34" rx="17" fill="#dc2626"/>
  <text x="400" y="42" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">BIPHASIC DEFIBRILLATOR / MONITOR / PACER</text>
</svg>
