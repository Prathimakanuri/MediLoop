<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="ecgBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- ECG Main Console Device (Angled Perspective Look) -->
  <g filter="url(#dropShadow)">
    <rect x="160" y="140" width="480" height="340" rx="20" fill="url(#ecgBody)" stroke="#cbd5e1" stroke-width="3"/>
    
    <!-- Thermal Paper Printer Slot on Right -->
    <rect x="460" y="170" width="155" height="190" rx="8" fill="#1e293b"/>
    <rect x="475" y="195" width="125" height="180" fill="#fffbeb" stroke="#fef08a" stroke-width="2"/>
    <!-- ECG Paper Grid -->
    <g opacity="0.3" stroke="#f87171" stroke-width="0.8">
      <line x1="475" y1="210" x2="600" y2="210"/>
      <line x1="475" y1="230" x2="600" y2="230"/>
      <line x1="475" y1="250" x2="600" y2="250"/>
      <line x1="475" y1="270" x2="600" y2="270"/>
      <line x1="475" y1="290" x2="600" y2="290"/>
      <line x1="475" y1="310" x2="600" y2="310"/>
      <line x1="475" y1="330" x2="600" y2="330"/>
      <line x1="475" y1="350" x2="600" y2="350"/>
      <line x1="495" y1="195" x2="495" y2="375"/>
      <line x1="515" y1="195" x2="515" y2="375"/>
      <line x1="535" y1="195" x2="535" y2="375"/>
      <line x1="555" y1="195" x2="555" y2="375"/>
      <line x1="575" y1="195" x2="575" y2="375"/>
    </g>
    <!-- Printed 12-lead Traces -->
    <path d="M 480 230 L 500 230 L 505 215 L 510 245 L 513 205 L 517 235 L 520 230 L 560 230 L 565 215 L 570 245 L 573 205 L 577 235 L 580 230 L 595 230" fill="none" stroke="#dc2626" stroke-width="1.6"/>
    <path d="M 480 280 L 505 280 L 510 268 L 514 290 L 517 260 L 520 285 L 525 280 L 565 280 L 570 268 L 574 290 L 577 260 L 580 285 L 585 280 L 595 280" fill="none" stroke="#dc2626" stroke-width="1.6"/>
    <path d="M 480 330 L 500 330 L 505 320 L 510 340 L 513 310 L 517 335 L 520 330 L 560 330 L 565 320 L 570 340 L 573 310 L 577 335 L 580 330 L 595 330" fill="none" stroke="#dc2626" stroke-width="1.6"/>

    <!-- Left Screen Display -->
    <rect x="185" y="170" width="255" height="190" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="195" y="195" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">12-LEAD DIAGNOSTIC ECG</text>
    <text x="195" y="215" font-family="sans-serif" font-size="11" fill="#22c55e">HR: 75 bpm | PR: 156ms | QRS: 88ms</text>
    <path d="M 195 250 L 230 250 L 235 235 L 240 265 L 243 220 L 247 255 L 250 250 L 300 250 L 305 235 L 310 265 L 313 220 L 317 255 L 320 250 L 370 250 L 375 235 L 380 265 L 383 220 L 387 255 L 390 250 L 425 250" fill="none" stroke="#22c55e" stroke-width="2"/>
    <path d="M 195 300 L 225 300 L 230 288 L 235 310 L 238 275 L 242 305 L 245 300 L 295 300 L 300 288 L 305 310 L 308 275 L 312 305 L 315 300 L 365 300 L 370 288 L 375 310 L 378 275 L 382 305 L 385 300 L 425 300" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="195" y="345" font-family="sans-serif" font-size="11" fill="#cbd5e1">25 mm/s | 10 mm/mV | Normal Sinus Rhythm</text>

    <!-- Bottom Keyboard / Controls -->
    <rect x="185" y="380" width="430" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="200" y="395" width="80" height="30" rx="6" fill="#0d9488"/>
    <text x="240" y="415" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">PRINT 12-L</text>
    
    <rect x="295" y="395" width="70" height="30" rx="6" fill="#0284c7"/>
    <text x="330" y="415" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">AUTO</text>

    <rect x="380" y="395" width="70" height="30" rx="6" fill="#64748b"/>
    <text x="415" y="415" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">MANUAL</text>

    <!-- Patient Cable Connector Ports -->
    <circle cx="560" cy="410" r="14" fill="#0f172a"/>
    <circle cx="560" cy="410" r="8" fill="#f59e0b"/>
  </g>

  <!-- ECG Chest Bulb Electrodes & Limb Clamps -->
  <g transform="translate(80, 480)">
    <rect x="50" y="10" width="220" height="60" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="80" cy="40" r="16" fill="#ef4444"/>
    <circle cx="120" cy="40" r="16" fill="#eab308"/>
    <circle cx="160" cy="40" r="16" fill="#22c55e"/>
    <circle cx="200" cy="40" r="16" fill="#8b5cf6"/>
    <circle cx="240" cy="40" r="16" fill="#3b82f6"/>
    <text x="160" y="22" font-family="sans-serif" font-size="10" fill="#475569" font-weight="bold" text-anchor="middle">10-LEAD PATIENT CABLE HARNESS INCLUDED</text>
  </g>

  <!-- Badge Header -->
  <rect x="260" y="40" width="280" height="34" rx="17" fill="#0d9488"/>
  <text x="400" y="62" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">12-LEAD DIAGNOSTIC ECG SYSTEM</text>
</svg>
