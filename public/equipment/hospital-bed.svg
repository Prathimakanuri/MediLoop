<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="mattressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Hospital Bed Structure -->
  <g filter="url(#dropShadow)" transform="translate(40, 20)">
    <!-- Floor Shadow -->
    <ellipse cx="360" cy="510" rx="300" ry="24" fill="#64748b" opacity="0.3"/>

    <!-- Castor Wheels & Central Braking System -->
    <g>
      <!-- Front Left Wheel -->
      <circle cx="160" cy="490" r="22" fill="#1e293b"/>
      <circle cx="160" cy="490" r="10" fill="#94a3b8"/>
      <rect x="155" y="440" width="10" height="50" fill="#475569"/>

      <!-- Front Right Wheel -->
      <circle cx="560" cy="490" r="22" fill="#1e293b"/>
      <circle cx="560" cy="490" r="10" fill="#94a3b8"/>
      <rect x="555" y="440" width="10" height="50" fill="#475569"/>

      <!-- Lower Chassis / Scissor Lift Mechanism -->
      <rect x="180" y="430" width="360" height="24" rx="6" fill="#334155"/>
      <line x1="220" y1="430" x2="330" y2="350" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
      <line x1="330" y1="430" x2="220" y2="350" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
      <line x1="500" y1="430" x2="390" y2="350" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
      <line x1="390" y1="430" x2="500" y2="350" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
      
      <!-- Electric Actuator Motor -->
      <rect x="320" y="380" width="80" height="40" rx="8" fill="#0d9488"/>
      <text x="360" y="405" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">MOTOR 24V</text>
    </g>

    <!-- Upper Bed Frame Structure -->
    <rect x="120" y="335" width="480" height="20" rx="4" fill="#475569"/>

    <!-- Multi-Section Articulating Mattress Platform -->
    <!-- Head Section (Raised 35 degrees) -->
    <g transform="rotate(-25, 230, 335)">
      <rect x="110" y="275" width="130" height="60" rx="12" fill="url(#mattressGrad)" stroke="#38bdf8" stroke-width="2"/>
      <rect x="100" y="240" width="20" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/> <!-- Headboard -->
      <!-- Pillow -->
      <rect x="130" y="260" width="70" height="25" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>

    <!-- Mid Section / Pelvic -->
    <rect x="235" y="280" width="120" height="55" rx="8" fill="url(#mattressGrad)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Thigh & Foot Section (Fowler's Position) -->
    <g transform="rotate(10, 355, 335)">
      <rect x="355" y="280" width="120" height="55" rx="8" fill="url(#mattressGrad)" stroke="#38bdf8" stroke-width="2"/>
    </g>
    <g transform="rotate(-5, 475, 335)">
      <rect x="470" y="280" width="110" height="55" rx="8" fill="url(#mattressGrad)" stroke="#38bdf8" stroke-width="2"/>
      <rect x="575" y="260" width="16" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/> <!-- Footboard -->
    </g>

    <!-- Fold-down Split Side Safety Rails -->
    <rect x="150" y="225" width="120" height="50" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="3" opacity="0.95"/>
    <line x1="180" y1="230" x2="180" y2="270" stroke="#0d9488" stroke-width="2"/>
    <line x1="210" y1="230" x2="210" y2="270" stroke="#0d9488" stroke-width="2"/>
    <line x1="240" y1="230" x2="240" y2="270" stroke="#0d9488" stroke-width="2"/>

    <!-- Nurse Call & Bed Control Panel on Rail -->
    <rect x="170" y="235" width="50" height="25" rx="4" fill="#0f172a"/>
    <circle cx="180" cy="247" r="4" fill="#22c55e"/>
    <circle cx="195" cy="247" r="4" fill="#38bdf8"/>
    <circle cx="210" cy="247" r="4" fill="#f59e0b"/>

    <rect x="380" y="235" width="120" height="50" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="3" opacity="0.95"/>
    <line x1="410" y1="240" x2="410" y2="280" stroke="#0d9488" stroke-width="2"/>
    <line x1="440" y1="240" x2="440" y2="280" stroke="#0d9488" stroke-width="2"/>
    <line x1="470" y1="240" x2="470" y2="280" stroke="#0d9488" stroke-width="2"/>

    <!-- IV Pole with Drip Bag -->
    <line x1="110" y1="350" x2="110" y2="120" stroke="#64748b" stroke-width="6"/>
    <line x1="90" y1="130" x2="130" y2="130" stroke="#64748b" stroke-width="4"/>
    <path d="M 95 130 C 95 160, 115 160, 115 130 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  </g>

  <!-- Badge Header -->
  <rect x="230" y="20" width="340" height="34" rx="17" fill="#0d9488"/>
  <text x="400" y="42" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5-FUNCTION MOTORIZED ICU HOSPITAL BED</text>
</svg>
