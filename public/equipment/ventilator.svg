<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f766e" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.15" stroke="#0d9488" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <!-- Mobile Stand Base & Wheels -->
  <g filter="url(#dropShadow)">
    <ellipse cx="400" cy="540" rx="140" ry="20" fill="#334155" opacity="0.3"/>
    <rect x="385" y="360" width="30" height="170" rx="6" fill="url(#standGrad)"/>
    <!-- Wheeled Legs -->
    <path d="M400 520 L300 545 L290 555 L315 555 L400 530 L485 555 L510 555 L500 545 Z" fill="#334155"/>
    <circle cx="295" cy="555" r="12" fill="#1e293b"/>
    <circle cx="295" cy="555" r="6" fill="#94a3b8"/>
    <circle cx="505" cy="555" r="12" fill="#1e293b"/>
    <circle cx="505" cy="555" r="6" fill="#94a3b8"/>
    <circle cx="400" cy="550" r="10" fill="#1e293b"/>
  </g>

  <!-- Humidifier Chamber & Tubes on Stand -->
  <rect x="425" y="380" width="55" height="70" rx="8" fill="#e2e8f0" stroke="#0d9488" stroke-width="2"/>
  <rect x="430" y="405" width="45" height="40" rx="4" fill="#06b6d4" opacity="0.4"/>
  <text x="452" y="430" font-family="sans-serif" font-size="9" fill="#0f766e" font-weight="bold" text-anchor="middle">HUMIDIFIER</text>
  
  <!-- Ventilator Main Body -->
  <g filter="url(#dropShadow)">
    <rect x="260" y="110" width="280" height="260" rx="20" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="3"/>
    
    <!-- Top Handle -->
    <rect x="340" y="85" width="120" height="25" rx="8" fill="#475569"/>
    
    <!-- Top Alarm Bar -->
    <rect x="290" y="125" width="220" height="10" rx="5" fill="#10b981"/>
    
    <!-- Main Display Screen -->
    <rect x="285" y="145" width="230" height="150" rx="12" fill="url(#screenGrad)" stroke="#334155" stroke-width="3"/>
    
    <!-- Waveforms on Screen -->
    <path d="M 295 190 Q 320 160 340 190 T 385 190 Q 405 155 425 190 T 470 190 Q 490 160 505 190" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
    <path d="M 295 230 Q 315 250 335 230 T 375 230 Q 395 255 415 230 T 455 230 Q 480 250 505 230" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 295 265 Q 310 275 330 265 T 370 265 Q 390 275 410 265 T 450 265 Q 475 275 505 265" fill="none" stroke="#fbbf24" stroke-width="1.8"/>

    <!-- Digital Readouts -->
    <text x="300" y="165" font-family="sans-serif" font-size="12" fill="#2dd4bf" font-weight="bold">FiO2: 45%</text>
    <text x="375" y="165" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">PEEP: 8</text>
    <text x="445" y="165" font-family="sans-serif" font-size="12" fill="#fbbf24" font-weight="bold">BPM: 16</text>

    <!-- Control Dials & Ports -->
    <circle cx="310" cy="330" r="16" fill="#0d9488"/>
    <circle cx="310" cy="330" r="8" fill="#f8fafc"/>
    
    <!-- Port Outlets -->
    <rect x="360" y="320" width="30" height="22" rx="4" fill="#64748b"/>
    <circle cx="375" cy="331" r="7" fill="#0284c7"/>
    
    <rect x="410" y="320" width="30" height="22" rx="4" fill="#64748b"/>
    <circle cx="425" cy="331" r="7" fill="#0d9488"/>

    <rect x="460" y="315" width="60" height="32" rx="6" fill="#1e293b"/>
    <text x="490" y="335" font-family="sans-serif" font-size="11" fill="#f8fafc" font-weight="bold" text-anchor="middle">START</text>
  </g>

  <!-- Breathing Circuit Tubes -->
  <path d="M375 338 C 320 390, 240 420, 210 360 C 190 320, 210 240, 240 220" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 3"/>
  <path d="M425 338 C 480 390, 560 410, 580 350 C 600 290, 560 220, 540 220" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 3"/>

  <!-- Badge Header -->
  <rect x="270" y="40" width="260" height="34" rx="17" fill="#0d9488"/>
  <text x="400" y="62" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">ICU MECHANICAL VENTILATOR</text>
</svg>
