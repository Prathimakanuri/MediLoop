<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="workstationBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f766e" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Anesthesia Workstation Frame -->
  <g filter="url(#dropShadow)" transform="translate(100, 10)">
    <!-- Base and Large Castors -->
    <ellipse cx="300" cy="540" rx="200" ry="22" fill="#334155" opacity="0.3"/>
    <rect x="150" y="470" width="300" height="60" rx="12" fill="#1e293b"/>
    <circle cx="180" cy="530" r="16" fill="#0f172a"/>
    <circle cx="420" cy="530" r="16" fill="#0f172a"/>

    <!-- Main Workstation Cabinet & Drawers -->
    <rect x="160" y="270" width="280" height="200" rx="12" fill="url(#workstationBody)" stroke="#94a3b8" stroke-width="2"/>
    <!-- 3 Drawers -->
    <rect x="180" y="290" width="240" height="45" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="270" y="307" width="60" height="10" rx="3" fill="#64748b"/>

    <rect x="180" y="345" width="240" height="45" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="270" y="362" width="60" height="10" rx="3" fill="#64748b"/>

    <rect x="180" y="400" width="240" height="45" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="270" y="417" width="60" height="10" rx="3" fill="#64748b"/>

    <!-- Vaporizers (Isoflurane Purple & Sevoflurane Yellow) -->
    <g transform="translate(180, 130)">
      <!-- Isoflurane Unit -->
      <rect x="0" y="0" width="55" height="120" rx="8" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
      <rect x="10" y="20" width="35" height="60" rx="4" fill="#ddd6fe"/>
      <circle cx="27" cy="50" r="12" fill="#5b21b6"/>
      <text x="27" y="105" font-family="sans-serif" font-size="8" fill="#ffffff" font-weight="bold" text-anchor="middle">ISOFLURANE</text>

      <!-- Sevoflurane Unit -->
      <rect x="70" y="0" width="55" height="120" rx="8" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
      <rect x="80" y="20" width="35" height="60" rx="4" fill="#fef08a"/>
      <circle cx="97" cy="50" r="12" fill="#ca8a04"/>
      <text x="97" y="105" font-family="sans-serif" font-size="8" fill="#713f12" font-weight="bold" text-anchor="middle">SEVOFLURANE</text>

      <!-- Desflurane Blue Unit -->
      <rect x="140" y="0" width="55" height="120" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
      <rect x="150" y="20" width="35" height="60" rx="4" fill="#bae6fd"/>
      <circle cx="167" cy="50" r="12" fill="#0369a1"/>
      <text x="167" y="105" font-family="sans-serif" font-size="8" fill="#ffffff" font-weight="bold" text-anchor="middle">DESFLURANE</text>
    </g>

    <!-- Electronic Gas Flowmeters (O2, N2O, Air) -->
    <rect x="390" y="130" width="60" height="120" rx="8" fill="#0f172a"/>
    <line x1="405" y1="140" x2="405" y2="230" stroke="#22c55e" stroke-width="3"/>
    <line x1="420" y1="140" x2="420" y2="230" stroke="#38bdf8" stroke-width="3"/>
    <line x1="435" y1="140" x2="435" y2="230" stroke="#e2e8f0" stroke-width="3"/>
    <text x="420" y="245" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">O2/N2O/AIR</text>

    <!-- Top Anesthesia Ventilator Display Monitor -->
    <rect x="465" y="70" width="130" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="475" y="80" width="110" height="160" rx="6" fill="#020617"/>
    <text x="480" y="100" font-family="sans-serif" font-size="9" fill="#22c55e" font-weight="bold">VT: 480 mL</text>
    <text x="480" y="120" font-family="sans-serif" font-size="9" fill="#38bdf8" font-weight="bold">RR: 14 bpm</text>
    <text x="480" y="140" font-family="sans-serif" font-size="9" fill="#fbbf24" font-weight="bold">Ppeak: 18 cmH2O</text>
    <path d="M 480 170 Q 495 150 510 170 T 540 170 T 570 170" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="480" y="210" font-family="sans-serif" font-size="9" fill="#e2e8f0">EtCO2: 36 mmHg</text>

    <!-- Breathing System Bellows & CO2 Absorber Canister -->
    <g transform="translate(460, 270)">
      <!-- Transparent Bellows Glass Chamber -->
      <rect x="0" y="0" width="70" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" opacity="0.8"/>
      <!-- Internal Bellows Folds -->
      <path d="M 10 30 L 60 30 L 50 45 L 60 60 L 50 75 L 60 75" fill="none" stroke="#0284c7" stroke-width="3"/>
      
      <!-- Soda Lime CO2 Absorber Canister -->
      <rect x="0" y="100" width="70" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text x="35" y="150" font-family="sans-serif" font-size="9" fill="#92400e" font-weight="bold" text-anchor="middle">SODA LIME</text>
    </g>
  </g>

  <!-- Badge Header -->
  <rect x="230" y="20" width="340" height="34" rx="17" fill="#0d9488"/>
  <text x="400" y="42" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">INTEGRATED ANESTHESIA WORKSTATION</text>
</svg>
