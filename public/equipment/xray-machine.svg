<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="xrayBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Mobile Digital X-Ray System -->
  <g filter="url(#dropShadow)" transform="translate(60, 10)">
    <!-- Base Floor Shadow -->
    <ellipse cx="320" cy="530" rx="180" ry="22" fill="#475569" opacity="0.3"/>

    <!-- Heavy Drive Base Chassis -->
    <rect x="200" y="440" width="240" height="80" rx="18" fill="#1e293b"/>
    <!-- Big Drive Wheels -->
    <circle cx="230" cy="520" r="22" fill="#0f172a"/>
    <circle cx="230" cy="520" r="10" fill="#94a3b8"/>
    <circle cx="410" cy="520" r="22" fill="#0f172a"/>
    <circle cx="410" cy="520" r="10" fill="#94a3b8"/>

    <!-- Generator & Battery Housing Column -->
    <rect x="230" y="240" width="180" height="210" rx="16" fill="url(#xrayBody)" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Integrated Touchscreen Console -->
    <rect x="250" y="260" width="140" height="95" rx="8" fill="#020617"/>
    <text x="260" y="280" font-family="sans-serif" font-size="10" fill="#38bdf8" font-weight="bold">MOBILE DR X-RAY</text>
    <text x="260" y="300" font-family="sans-serif" font-size="12" fill="#22c55e" font-weight="bold">80 kV | 200 mAs</text>
    <text x="260" y="320" font-family="sans-serif" font-size="9" fill="#e2e8f0">CHEST PA | WIRELESS FPD</text>
    <rect x="345" y="325" width="40" height="20" rx="4" fill="#0d9488"/>
    <text x="365" y="338" font-family="sans-serif" font-size="8" fill="#ffffff" font-weight="bold" text-anchor="middle">EXPOSE</text>

    <!-- Flat Panel Detector Storage Slot & Wireless Plate -->
    <rect x="215" y="365" width="20" height="110" rx="4" fill="#334155"/>
    <!-- Digital FPD Detector Plate -->
    <g transform="translate(480, 360)">
      <rect x="0" y="0" width="120" height="140" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
      <rect x="10" y="10" width="100" height="120" rx="4" fill="#1e293b"/>
      <!-- X-Ray Crosshairs -->
      <line x1="60" y1="20" x2="60" y2="120" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="20" y1="70" x2="100" y2="70" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="60" cy="70" r="16" fill="none" stroke="#0284c7" stroke-width="1.5"/>
      <text x="60" y="115" font-family="sans-serif" font-size="8" fill="#38bdf8" text-anchor="middle">DIGITAL FPD 14x17"</text>
    </g>

    <!-- Telescopic Articulated Support Column -->
    <rect x="290" y="100" width="40" height="150" fill="#475569"/>
    
    <!-- Rotating X-Ray Tube Arm -->
    <line x1="310" y1="110" x2="480" y2="110" stroke="#334155" stroke-width="20" stroke-linecap="round"/>

    <!-- High Frequency X-Ray Tube Head & Collimator -->
    <rect x="440" y="70" width="80" height="80" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="480" cy="110" r="18" fill="#eab308"/> <!-- Radiation Warning -->
    <polygon points="480,100 487,115 473,115" fill="#0f172a"/>
    
    <!-- Collimator Box & Beam Light -->
    <rect x="450" y="150" width="60" height="40" rx="4" fill="#334155"/>
    <polygon points="455,190 410,320 550,320 505,190" fill="#fef08a" opacity="0.3"/>
  </g>

  <!-- Badge Header -->
  <rect x="230" y="20" width="340" height="34" rx="17" fill="#0d9488"/>
  <text x="400" y="42" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">PORTABLE HIGH-FREQUENCY DIGITAL X-RAY</text>
</svg>
