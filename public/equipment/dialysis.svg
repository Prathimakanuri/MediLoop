<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Dialysis Machine Frame -->
  <g filter="url(#dropShadow)" transform="translate(140, 10)">
    <!-- Base with Lockable Wheels -->
    <ellipse cx="260" cy="540" rx="160" ry="20" fill="#334155" opacity="0.3"/>
    <rect x="140" y="490" width="240" height="40" rx="8" fill="#1e293b"/>
    <circle cx="160" cy="535" r="14" fill="#0f172a"/>
    <circle cx="360" cy="535" r="14" fill="#0f172a"/>

    <!-- Main Cabinet Column -->
    <rect x="150" y="90" width="220" height="400" rx="20" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="3"/>

    <!-- Top Touchscreen Monitor -->
    <rect x="170" y="110" width="180" height="110" rx="10" fill="#020617"/>
    <text x="180" y="130" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="bold">HEMODIALYSIS SYSTEM</text>
    <text x="180" y="150" font-family="sans-serif" font-size="12" fill="#22c55e" font-weight="bold">QB: 350 mL/min</text>
    <text x="180" y="170" font-family="sans-serif" font-size="11" fill="#fbbf24">QD: 500 mL/min | UF: 2.4L</text>
    <text x="180" y="195" font-family="sans-serif" font-size="10" fill="#cbd5e1">TIME REMAINING: 02:15:00</text>

    <!-- Peristaltic Blood Pump (Rotating Rotor) -->
    <rect x="170" y="235" width="85" height="85" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="212" cy="277" r="32" fill="#334155"/>
    <circle cx="212" cy="277" r="22" fill="#e2e8f0"/>
    <circle cx="202" cy="267" r="6" fill="#ef4444"/> <!-- Roller 1 -->
    <circle cx="222" cy="287" r="6" fill="#ef4444"/> <!-- Roller 2 -->
    <text x="212" y="330" font-family="sans-serif" font-size="9" fill="#0f172a" font-weight="bold" text-anchor="middle">BLOOD PUMP</text>

    <!-- Heparin Syringe Pump -->
    <rect x="270" y="235" width="80" height="85" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="285" y="245" width="20" height="55" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="310" y="255" width="30" height="15" rx="3" fill="#10b981"/>
    <text x="310" y="330" font-family="sans-serif" font-size="9" fill="#0f172a" font-weight="bold" text-anchor="middle">HEPARIN</text>

    <!-- Arterial & Venous Chamber Pressure Monitors -->
    <rect x="170" y="345" width="180" height="50" rx="8" fill="#e2e8f0"/>
    <circle cx="200" cy="370" r="14" fill="#ef4444"/>
    <text x="200" y="374" font-family="sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">ART</text>
    <circle cx="320" cy="370" r="14" fill="#3b82f6"/>
    <text x="320" y="374" font-family="sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">VEN</text>

    <!-- Dialyzer (Artificial Kidney Filter Cylinder on Side) -->
    <g transform="translate(390, 160)">
      <rect x="0" y="0" width="40" height="180" rx="12" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
      <rect x="5" y="20" width="30" height="140" fill="#dbeafe"/>
      <!-- Hollow fiber lines -->
      <line x1="12" y1="25" x2="12" y2="155" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="20" y1="25" x2="20" y2="155" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="28" y1="25" x2="28" y2="155" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="20" y="95" font-family="sans-serif" font-size="8" fill="#1e3a8a" font-weight="bold" transform="rotate(90, 20, 95)" text-anchor="middle">DIALYZER 1.8m²</text>

      <!-- Dialysate Fluid Connectors (Blue & Red lines) -->
      <path d="M 0 35 C -30 35, -50 180, -20 220" fill="none" stroke="#ef4444" stroke-width="5"/>
      <path d="M 0 145 C -30 145, -50 200, -20 250" fill="none" stroke="#3b82f6" stroke-width="5"/>
    </g>

    <!-- Acid & Bicarbonate Concentrate Jugs at Bottom -->
    <rect x="170" y="410" width="80" height="70" rx="8" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
    <text x="210" y="450" font-family="sans-serif" font-size="10" fill="#9a3412" font-weight="bold" text-anchor="middle">ACID (A)</text>

    <rect x="270" y="410" width="80" height="70" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
    <text x="310" y="450" font-family="sans-serif" font-size="10" fill="#166534" font-weight="bold" text-anchor="middle">BICARB (B)</text>
  </g>

  <!-- Badge Header -->
  <rect x="230" y="20" width="340" height="34" rx="17" fill="#0d9488"/>
  <text x="400" y="42" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">HIGH-FLUX HEMODIALYSIS SYSTEM</text>
</svg>
