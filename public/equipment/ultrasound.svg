<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Ultrasound Mobile Cart Base & Wheels -->
  <g filter="url(#dropShadow)">
    <ellipse cx="400" cy="540" rx="160" ry="24" fill="#334155" opacity="0.3"/>
    <!-- Heavy-duty Base -->
    <path d="M 280 520 L 520 520 L 540 550 L 260 550 Z" fill="#334155"/>
    <circle cx="270" cy="550" r="14" fill="#1e293b"/>
    <circle cx="270" cy="550" r="6" fill="#94a3b8"/>
    <circle cx="530" cy="550" r="14" fill="#1e293b"/>
    <circle cx="530" cy="550" r="6" fill="#94a3b8"/>

    <!-- Central Column & Storage Bins -->
    <rect x="365" y="340" width="70" height="185" rx="8" fill="url(#cartGrad)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="350" y="420" width="100" height="70" rx="6" fill="#e2e8f0" stroke="#0d9488" stroke-width="2"/>
    <text x="400" y="460" font-family="sans-serif" font-size="11" fill="#0f766e" font-weight="bold" text-anchor="middle">GEL &amp; PROBES</text>
  </g>

  <!-- Main Console & Control Keyboard -->
  <g filter="url(#dropShadow)">
    <polygon points="250,340 550,340 580,280 220,280" fill="url(#cartGrad)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Trackball -->
    <circle cx="400" cy="310" r="18" fill="#0284c7"/>
    <circle cx="400" cy="310" r="9" fill="#e0f2fe"/>
    <!-- TGC Slider Controls -->
    <g transform="translate(260, 290)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#64748b" stroke-width="2"/>
      <line x1="0" y1="8" x2="60" y2="8" stroke="#64748b" stroke-width="2"/>
      <line x1="0" y1="16" x2="60" y2="16" stroke="#64748b" stroke-width="2"/>
      <line x1="0" y1="24" x2="60" y2="24" stroke="#64748b" stroke-width="2"/>
      <line x1="0" y1="32" x2="60" y2="32" stroke="#64748b" stroke-width="2"/>
      <circle cx="15" cy="0" r="4" fill="#0d9488"/>
      <circle cx="25" cy="8" r="4" fill="#0d9488"/>
      <circle cx="40" cy="16" r="4" fill="#0d9488"/>
      <circle cx="35" cy="24" r="4" fill="#0d9488"/>
      <circle cx="20" cy="32" r="4" fill="#0d9488"/>
    </g>
    <!-- Soft Touch Buttons -->
    <rect x="440" y="290" width="45" height="18" rx="4" fill="#0d9488"/>
    <text x="462" y="303" font-family="sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">FREEZE</text>
    <rect x="495" y="290" width="45" height="18" rx="4" fill="#0284c7"/>
    <text x="517" y="303" font-family="sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">MEASURE</text>

    <!-- Transducer Probe Holders with Probes & Wires -->
    <rect x="185" y="290" width="28" height="50" rx="6" fill="#334155"/>
    <!-- Convex Probe -->
    <path d="M 190 270 L 210 270 L 205 240 L 195 240 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 200 290 Q 170 380 200 480 Q 230 420 370 370" fill="none" stroke="#475569" stroke-width="5"/>

    <rect x="585" y="290" width="28" height="50" rx="6" fill="#334155"/>
    <!-- Linear Probe -->
    <rect x="590" y="240" width="20" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 600 290 Q 630 380 600 480 Q 570 420 430 370" fill="none" stroke="#475569" stroke-width="5"/>

    <!-- Articulating Display Arm & Monitor -->
    <rect x="385" y="220" width="30" height="60" rx="4" fill="#475569"/>
    
    <rect x="250" y="70" width="300" height="175" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="265" y="85" width="270" height="145" rx="8" fill="#020617"/>

    <!-- Ultrasound Doppler Fan Graphic -->
    <path d="M 400 95 L 300 215 A 130 130 0 0 0 500 215 Z" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <path d="M 400 95 L 340 190 A 80 80 0 0 0 460 190 Z" fill="#1e293b" opacity="0.6"/>
    <!-- Color Doppler Blood Flow Jet -->
    <ellipse cx="400" cy="165" rx="28" ry="18" fill="#ef4444" opacity="0.7"/>
    <ellipse cx="410" cy="168" rx="16" ry="10" fill="#3b82f6" opacity="0.8"/>
    <text x="275" y="105" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="bold">COLOR DOPPLER</text>
    <text x="275" y="122" font-family="sans-serif" font-size="9" fill="#22c55e">Freq: 3.5MHz | Depth: 16cm</text>
  </g>

  <!-- Badge Header -->
  <rect x="240" y="20" width="320" height="34" rx="17" fill="#0d9488"/>
  <text x="400" y="42" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">COLOR DOPPLER ULTRASOUND SYSTEM</text>
</svg>
