<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48" fill="none">
  <!-- Medical Infinity / Loop with Cross Symbol -->
  <g transform="translate(4, 4)">
    <!-- Outer Glow / Background Pill -->
    <rect x="0" y="0" width="40" height="40" rx="12" fill="#0d9488"/>
    
    <!-- Medical Cross inside Loop -->
    <path d="M 20 10 L 20 30 M 10 20 L 30 20" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Heartbeat Pulse Line -->
    <path d="M 10 20 L 15 20 L 18 13 L 22 27 L 25 20 L 30 20" stroke="#99f6e4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: MEDILOOP -->
  <text x="52" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
    MEDI<tspan fill="#0d9488">LOOP</tspan>
  </text>
  <text x="53" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#64748b" letter-spacing="1">
    B2B MEDICAL EQUIPMENT
  </text>
</svg>
